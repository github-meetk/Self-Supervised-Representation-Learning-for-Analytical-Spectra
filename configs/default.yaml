data:
  source: auto
  n_classes: 6
  n_per_class: 80
  n_points: 256
  seed: 42
preprocessing:
  baseline: true
  smoothing: true
  window_length: 9
  polyorder: 2
  normalization: snv
model:
  embedding_dim: 64
  epochs: 12
  batch_size: 64
  learning_rate: 0.001
  patience: 4
evaluation:
  seeds: 10
  label_fractions: [0.01, 0.1, 1.0]
  noise_snr_db: [30, 20, 10]
  output_dir: results
